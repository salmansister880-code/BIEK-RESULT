<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result Demo</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6f8;
    color:#202124;
    font-family:'Roboto', Arial, sans-serif;
}

/* Small required demo identification */
.demo-tag{
    position:fixed;
    right:8px;
    bottom:8px;
    z-index:1000;
    background:rgba(32,33,36,.88);
    color:#fff;
    padding:5px 8px;
    border-radius:6px;
    font-size:10px;
    letter-spacing:.2px;
}

/* PAGE */
.page{
    width:100%;
    max-width:760px;
    margin:auto;
    min-height:100vh;
}

/* HEADER */
.header{
    height:88px;
    display:flex;
    align-items:center;
    padding:15px 31px;
}

.back{
    border:0;
    background:transparent;
    font-size:33px;
    line-height:1;
    padding:0;
    margin-right:30px;
    cursor:pointer;
    color:#202124;
}

.header-title{
    font-size:25px;
    font-weight:700;
}

/* MAIN CARD */
.card{
    margin:8px 20px 25px;
    padding:31px 29px 28px;
    background:#fff;
    border-radius:27px;
    box-shadow:
        0 1px 2px rgba(60,64,67,.08),
        0 2px 7px rgba(60,64,67,.05);
}

.title{
    margin:0 0 21px;
    font-size:26px;
    font-weight:700;
}

.description{
    margin:0 0 31px;
    max-width:580px;
    font-size:18px;
    line-height:1.48;
    color:#3c4043;
}

/* MATERIAL OUTLINED FIELD */
.field{
    position:relative;
    margin-bottom:25px;
}

.field label{
    position:absolute;
    left:18px;
    top:-9px;
    z-index:2;
    padding:0 6px;
    background:#fff;
    color:#5f6368;
    font-size:14px;
    line-height:18px;
}

.control{
    width:100%;
    height:66px;
    padding:0 20px;
    border:1px solid #9aa0a6;
    border-radius:18px;
    outline:none;
    background:#f8f9fa;
    color:#202124;
    font-family:inherit;
    font-size:17px;
    font-weight:500;
}

.control:focus{
    border:2px solid #087f73;
    padding-left:19px;
}

select.control{
    appearance:auto;
}

.roll{
    font-weight:400;
}

.helper{
    margin:8px 5px 0;
    color:#5f6368;
    font-size:14px;
}

/* BUTTON */
.search-btn{
    width:100%;
    height:64px;
    margin-top:7px;
    border:0;
    border-radius:19px;
    background:#087f73;
    color:#fff;
    font-family:inherit;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
}

.search-btn:active{
    transform:scale(.99);
}

.search-icon{
    display:inline-block;
    margin-right:10px;
    font-size:18px;
}

/* ERROR */
.error{
    display:none;
    margin-top:18px;
    text-align:center;
    color:#b3261e;
    font-size:15px;
    font-weight:500;
}

/* RESULT CARD */
#resultCard{
    display:none;
    animation:resultIn .45s ease;
}

@keyframes resultIn{
    from{
        opacity:0;
        transform:translateY(18px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.detail-title{
    margin:0 0 25px;
    font-size:25px;
    font-weight:700;
}

.detail-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:25px;
    padding:13px 0;
}

.detail-label{
    color:#5f6368;
    font-size:16px;
}

.detail-value{
    max-width:68%;
    text-align:right;
    color:#202124;
    font-size:16px;
    font-weight:700;
}

.green{
    color:#14a44d;
}

/* PASS */
.pass{
    margin-top:25px;
    height:61px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#18a957;
    border-radius:18px;
    color:#fff;
    font-size:20px;
    font-weight:700;
}

.pass.animate{
    animation:passPop .7s cubic-bezier(.2,.8,.2,1);
}

@keyframes passPop{
    0%{
        opacity:0;
        transform:scale(.7);
    }
    65%{
        opacity:1;
        transform:scale(1.06);
    }
    100%{
        transform:scale(1);
    }
}

/* CONFETTI */
.confetti{
    position:fixed;
    top:-30px;
    z-index:999;
    pointer-events:none;
    font-size:18px;
    animation:fall 2.6s linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-30px) rotate(0);
        opacity:1;
    }
    to{
        transform:translateY(105vh) rotate(620deg);
        opacity:0;
    }
}

/* PHONE */
@media(max-width:600px){

    .header{
        height:79px;
        padding:12px 24px;
    }

    .back{
        margin-right:25px;
        font-size:30px;
    }

    .header-title{
        font-size:23px;
    }

    .card{
        margin:7px 16px 22px;
        padding:27px 25px;
        border-radius:25px;
    }

    .title{
        font-size:25px;
    }

    .description{
        font-size:17px;
        line-height:1.5;
    }

    .control{
        height:64px;
        border-radius:18px;
    }

    .search-btn{
        height:62px;
    }

    .detail-row{
        padding:12px 0;
    }
}

@media(max-width:380px){

    .card{
        margin-left:12px;
        margin-right:12px;
        padding:23px 20px;
    }

    .description{
        font-size:16px;
    }

    .detail-value{
        max-width:62%;
        font-size:15px;
    }
}
</style>
</head>

<body>

<div class="page">

    <header class="header">
        <button class="back" type="button">←</button>
        <div class="header-title">Results</div>
    </header>

    <!-- SEARCH RESULT CARD -->
    <section class="card">

        <h1 class="title">Search Result</h1>

        <p class="description">
            Select your group, choose the result type, and enter
            your roll number to continue.
        </p>

        <div class="field">
            <label>Group</label>

            <select class="control">
                <option>Pre-Engineering</option>
                <option>Pre-Medical</option>
            </select>
        </div>

        <div class="field">
            <label>Result Type</label>

            <select class="control">
                <option>Regular Part I 2026 Annual</option>
            </select>
        </div>

        <div class="field">
            <label>Roll Number</label>

            <input
                class="control roll"
                type="number"
                id="rollNumber"
                inputmode="numeric"
                placeholder="Roll Number"
            >
        </div>

        <div class="field">
            <label>Matric Roll Number</label>

            <input
                class="control roll"
                type="number"
                id="matricRoll"
                inputmode="numeric"
                placeholder="Matric Roll Number"
            >

            <div class="helper">
                Needed only for detailed marks
            </div>
        </div>

        <button
            type="button"
            class="search-btn"
            onclick="searchResult()"
        >
            <span class="search-icon">⌕</span>
            Search Result
        </button>

        <div class="error" id="error">
            Result not found
        </div>

    </section>


    <!-- STUDENT DETAIL -->
    <section class="card" id="resultCard">

        <h2 class="detail-title">Student Detail</h2>

        <div class="detail-row">
            <span class="detail-label">Name</span>
            <span class="detail-value">
                MUHAMMAD SALMAN RAZA
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Father Name</span>
            <span class="detail-value">
                MUHAMMAD JUNAID
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Roll No</span>
            <span class="detail-value">
                714242
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Marks</span>
            <span class="detail-value">
                442
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Grade</span>
            <span class="detail-value green">
                Pass
            </span>
        </div>

        <div class="pass" id="passBox">
            PASS 🎉
        </div>

    </section>

</div>




<script>

const rollInput = document.getElementById("rollNumber");
const resultCard = document.getElementById("resultCard");
const error = document.getElementById("error");
const passBox = document.getElementById("passBox");


function searchResult(){

    const roll = rollInput.value.trim();

    if(roll === "714242"){

        error.style.display = "none";
        resultCard.style.display = "block";

        // Restart result animation
        resultCard.style.animation = "none";
        void resultCard.offsetWidth;
        resultCard.style.animation = "resultIn .45s ease";

        // Restart PASS animation
        passBox.classList.remove("animate");
        void passBox.offsetWidth;
        passBox.classList.add("animate");

        createConfetti();

        setTimeout(function(){

            resultCard.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });

        },200);

    }else{

        resultCard.style.display = "none";
        error.style.display = "block";

    }
}


/* Search with Enter key */
rollInput.addEventListener("keydown",function(e){

    if(e.key === "Enter"){
        searchResult();
    }

});


function createConfetti(){

    const pieces = ["🎉","✨","🎊"];

    for(let i = 0; i < 28; i++){

        const item = document.createElement("div");

        item.className = "confetti";

        item.textContent =
            pieces[Math.floor(Math.random() * pieces.length)];

        item.style.left =
            Math.random() * 95 + "vw";

        item.style.animationDelay =
            Math.random() * .7 + "s";

        item.style.fontSize =
            (14 + Math.random() * 11) + "px";

        document.body.appendChild(item);

        setTimeout(function(){
            item.remove();
        },3500);
    }
}

</script>

</body>
</html>
